{% extends 'portfolio/base.html' %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 3rem auto; padding: 2.5rem;">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary);">Superuser Portal Login</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div style="background-color: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter superuser username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer; margin-top: 1rem;">Log In</button>
    </form>
</div>
{% endblock %}
