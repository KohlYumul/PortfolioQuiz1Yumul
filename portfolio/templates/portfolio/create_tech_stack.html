{% extends 'portfolio/base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
    <h2 style="margin-bottom: 1.5rem; color: var(--primary);">Create Tech Stack</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_name">Tech Stack Name</label>
            {{ form.name }}
            {{ form.name.errors }}
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn" style="flex: 1; border: none; cursor: pointer;">Save Tech Stack</button>
            <a href="{% url 'dashboard' %}" class="btn" style="background-color: #64748b; text-decoration: none; text-align: center;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
