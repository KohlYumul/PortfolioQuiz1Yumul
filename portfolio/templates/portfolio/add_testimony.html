{% extends 'portfolio/base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1>Leave a Testimony</h1>
    <p>Share your experience working with me!</p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">{{ form.full_name.label_tag }} {{ form.full_name }}</div>
        <div class="form-group">{{ form.content.label_tag }} {{ form.content }}</div>
        <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Submit Feedback</button>
    </form>
</div>
{% endblock %}
